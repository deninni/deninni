name: plantOS CI

on:
  push:
    paths: ["plantos/**", ".github/workflows/plantos-ci.yml"]
  pull_request:
    paths: ["plantos/**", ".github/workflows/plantos-ci.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plantos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plantos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: API-Smoke gegen Produktions-Build
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf localhost:3000/api/health && break; sleep 1; done
          npm run smoke
